spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skillswap}
spring.datasource.username=${DB_USER:skillswap}
spring.datasource.password=${DB_PASSWORD:skillswap}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=false

ai.provider=${AI_PROVIDER:groq}
ai.max-output-tokens=1024
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}