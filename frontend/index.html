<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Peer Skill-Swap Board</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
</head>
<body>
<header>
    <h1>Peer Skill-Swap Board</h1>
    <div id="userBar"></div>
</header>

<section id="authSection">
    <div class="auth-forms">
        <form id="registerForm">
            <h2>Register</h2>
            <input type="text" id="regName" placeholder="Name" required />
            <input type="email" id="regEmail" placeholder="Email" required />
            <input type="password" id="regPassword" placeholder="Password" required minlength="6" />
            <button type="submit">Register</button>
        </form>

        <form id="loginForm">
            <h2>Login</h2>
            <input type="email" id="loginEmail" placeholder="Email" required />
            <input type="password" id="loginPassword" placeholder="Password" required />
            <button type="submit">Login</button>
        </form>
    </div>
    <p id="authError" class="error"></p>
</section>

<section id="appSection" hidden>
    <div class="panel">
        <h2>Post a skill</h2>
        <form id="postForm">
            <select id="postType" required>
                <option value="OFFER">I can help with...</option>
                <option value="NEED">I need help with...</option>
            </select>
            <input type="text" id="postSkillTag" placeholder="Skill (e.g. Java)" required />
            <textarea id="postDescription" placeholder="Describe it" required></textarea>
            <button type="submit">Post</button>
        </form>
    </div>

    <div class="panel">
        <h2>Board</h2>
        <div id="postsList"></div>
    </div>

    <div class="panel">
        <h2>My Matches</h2>
        <div id="matchesList"></div>
    </div>

    <div class="panel">
        <h2>Live Notifications</h2>
        <ul id="notifications"></ul>
    </div>
</section>

<script src="app.js"></script>
</body>
</html>
