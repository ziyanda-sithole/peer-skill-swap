<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peer Skill-Swap Board</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
</head>
<body>
<div id="toastContainer"></div>

<header>
    <h1>Peer Skill-Swap Board</h1>
    <div class="header-actions">
        <button id="themeToggle" class="secondary" type="button"></button>
        <div id="userBar"></div>
    </div>
</header>

<section id="authSection">
    <div class="auth-forms">
        <form id="registerForm">
            <h2>Register</h2>
            <input type="text" id="regName" placeholder="Name" required />
            <input type="email" id="regEmail" placeholder="Email" required />
            <input type="password" id="regPassword" placeholder="Password" required minlength="6" />
            <button type="submit">Register</button>
        </form>

        <form id="loginForm">
            <h2>Login</h2>
            <input type="email" id="loginEmail" placeholder="Email" required />
            <input type="password" id="loginPassword" placeholder="Password" required />
            <button type="submit">Login</button>
        </form>
    </div>
    <p id="authError" class="error"></p>
</section>

<section id="appSection" hidden>
    <div class="panel" id="roomPanel" hidden>
        <div class="room-header">
            <h2 id="roomTitle"></h2>
            <button id="closeRoomBtn" class="secondary" type="button">Close</button>
        </div>
        <div id="roomTopic" class="muted"></div>

        <h3>Chat</h3>
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="chat-form">
            <input type="text" id="chatInput" placeholder="Type a message" autocomplete="off" maxlength="2000" required />
            <button type="submit">Send</button>
        </form>

        <h3>Members</h3>
        <div id="membersList"></div>

        <h3>Reference resources</h3>
        <form id="resourceForm" class="resource-form">
            <input type="text" id="resourceQuery" placeholder="Search Wikipedia" required />
            <button type="submit">Search</button>
        </form>
        <div id="resourceResults"></div>
    </div>
    <div class="panel">
        <h2>Messages</h2>
        <form id="startDirectForm" class="invite-form">
            <input type="email" id="directEmailInput" placeholder="Message someone by email" required />
            <button type="submit">Start chat</button>
        </form>
        <form id="startGroupForm" class="invite-form">
            <input type="text" id="groupEmailsInput" placeholder="Emails, comma-separated" required />
            <button type="submit">Start group chat</button>
        </form>
        <div id="conversationsList"></div>
    </div>

    <div class="panel" id="dmPanel" hidden>
        <div class="room-header">
            <h2 id="dmTitle"></h2>
            <div>
                <button id="dmLeaveBtn" class="secondary" type="button">Leave</button>
                <button id="dmCloseBtn" class="secondary" type="button">Close</button>
            </div>
        </div>
        <div id="dmMembers" class="muted"></div>
        <div id="dmMessages" class="chat-messages"></div>
        <form id="dmForm" class="chat-form">
            <input type="text" id="dmInput" placeholder="Type a message" autocomplete="off" maxlength="2000" required />
            <button type="submit">Send</button>
        </form>
    </div>
    <div class="panel">
        <h2>Host a study session</h2>
        <form id="sessionForm">
            <input type="text" id="sessionTitle" placeholder="Title (e.g. Recursion Study Group)" required />
            <input type="text" id="sessionTopic" placeholder="Curriculum topic (e.g. Recursion)" required />
            <textarea id="sessionDescription" placeholder="What will you break down together?" required></textarea>
            <select id="sessionVisibility">
                <option value="PUBLIC">Public (listed on the board)</option>
                <option value="PRIVATE">Private (not listed)</option>
            </select>
            <select id="sessionType">
                <option value="GROUP">Group session</option>
                <option value="ONE_ON_ONE">One-on-one</option>
            </select>
            <button type="submit">Create session</button>
        </form>
    </div>

    <div class="panel">
        <h2>Board</h2>
        <div id="boardList"></div>
    </div>

    <div class="panel">
        <h2>My Sessions</h2>
        <div id="mySessionsList"></div>
    </div>

    <div class="panel">
        <h2>My Invites</h2>
        <div id="invitesList"></div>
    </div>

    <div class="panel">
        <h2>Live Notifications</h2>
        <ul id="notifications"></ul>
    </div>
</section>

<script src="theme.js"></script>
<script src="sessions.js"></script>
<script src="chat.js"></script>
<script src="resources.js"></script>
<script src="messages.js"></script>
<script src="app.js"></script>
</body>
</html>
